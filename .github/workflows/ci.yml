name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and UI screenshots (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Render every screen with mock data
        run: |
          npx playwright install --with-deps chromium
          npm run preview
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

  windows:
    name: Build and smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Win32 layer smoke test (read-only)
        run: npm run smoke:win
      - name: Build installer and portable zip
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: islet-windows
          path: |
            dist/*.exe
            dist/*.zip
